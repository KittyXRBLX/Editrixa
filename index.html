<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitty34</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#121212;--surface:#1e1e1e;--surface2:#2a2a2a;--primary:#ef5350;--primary-dark:#c62828;--text:#e0e0e0;--text-secondary:#9e9e9e;--border:#333;--nav-width:256px;--header-height:56px;--card-radius:4px;--transition:0.2s ease}
  [data-theme="light"]{--bg:#f5f5f5;--surface:#fff;--surface2:#eee;--text:#212121;--text-secondary:#757575;--border:#ddd}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

  /* APPBAR */
  .appbar{position:fixed;top:0;left:0;right:0;height:var(--header-height);background:var(--surface);display:flex;align-items:center;padding:0 8px;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .menu-btn,.icon-btn{width:40px;height:40px;border:none;background:none;cursor:pointer;color:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background var(--transition)}
  .menu-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.08)}
  .logo{font-size:1.25rem;font-weight:700;color:var(--primary);text-decoration:none;margin:0 12px;letter-spacing:.5px}
  .search-wrap{flex:1;max-width:540px;margin:0 8px;position:relative}
  .search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px 36px 6px 12px;color:var(--text);font-size:.9rem;outline:none;transition:border var(--transition)}
  .search-wrap input:focus{border-color:var(--primary)}
  .search-icon{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--text-secondary);pointer-events:none;font-size:20px}
  .spacer{flex:1}
  .right-actions{display:flex;align-items:center;gap:4px}
  .upload-btn{display:flex;align-items:center;gap:6px;background:var(--primary);border:none;border-radius:4px;color:#fff;cursor:pointer;padding:7px 14px;font-size:.85rem;font-weight:500;transition:background var(--transition)}
  .upload-btn:hover{background:var(--primary-dark)}

  /* SIDEBAR */
  .sidebar{position:fixed;top:var(--header-height);left:0;bottom:0;width:var(--nav-width);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;z-index:100;transition:transform .3s ease;display:flex;flex-direction:column}
  .sidebar.hidden{transform:translateX(-100%)}
  .nav-item{display:flex;align-items:center;gap:16px;padding:12px 16px;text-decoration:none;color:var(--text);font-size:.9rem;cursor:pointer;transition:background var(--transition);user-select:none}
  .nav-item:hover{background:rgba(255,255,255,.05)}
  .nav-item.active{color:var(--primary)}
  .nav-item .material-icons{font-size:22px}
  .nav-divider{height:1px;background:var(--border);margin:4px 0}
  .tag-creator{padding:12px 16px;border-top:1px solid var(--border);margin-top:auto}
  .tag-creator h4{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);margin-bottom:10px}
  .tag-input-wrap{display:flex;gap:6px;margin-bottom:8px}
  .tag-input-wrap input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);font-size:.8rem;outline:none}
  .tag-input-wrap input:focus{border-color:var(--primary)}
  .tag-input-wrap button{background:var(--primary);border:none;border-radius:4px;color:#fff;cursor:pointer;padding:6px 10px;font-size:.8rem;font-weight:500;transition:background var(--transition)}
  .tag-input-wrap button:hover{background:var(--primary-dark)}
  .tag-list{display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow-y:auto}
  .tag-chip{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:2px 8px;font-size:.75rem;color:var(--primary);cursor:pointer;display:flex;align-items:center;gap:4px;transition:background var(--transition)}
  .tag-chip:hover{background:rgba(239,83,80,.15)}

  /* MAIN */
  .main{margin-left:var(--nav-width);margin-top:var(--header-height);padding:12px;transition:margin-left .3s ease}
  .main.full{margin-left:0}

  /* TOOLBAR */
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .toolbar-left{display:flex;align-items:center;gap:8px}
  .filter-chip{padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:none;color:var(--text);font-size:.8rem;cursor:pointer;transition:all var(--transition)}
  .filter-chip.active,.filter-chip:hover{background:var(--primary);border-color:var(--primary);color:#fff}
  .view-toggle{display:flex;gap:4px}
  .view-btn{background:none;border:none;color:var(--text-secondary);cursor:pointer;border-radius:4px;padding:4px;display:flex;align-items:center;transition:color var(--transition)}
  .view-btn.active,.view-btn:hover{color:var(--primary)}
  .post-count{font-size:.8rem;color:var(--text-secondary)}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px}
  .grid.list-view{grid-template-columns:1fr}
  .grid.list-view .card{aspect-ratio:unset;height:110px}
  .grid.list-view .card img,.grid.list-view .card video{height:110px;width:100%}
  .card{position:relative;background:var(--surface2);border-radius:var(--card-radius);overflow:hidden;cursor:pointer;aspect-ratio:4/3;transition:transform var(--transition),box-shadow var(--transition)}
  .card:hover{transform:scale(1.02);box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:2}
  .card img,.card video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .card-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:28px 8px 7px;display:flex;align-items:flex-end;justify-content:space-between;opacity:0;transition:opacity var(--transition)}
  .card:hover .card-overlay{opacity:1}
  .card-info{flex:1;min-width:0}
  .card-title{font-size:.75rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
  .card-tags-row{display:flex;gap:3px;overflow:hidden}
  .card-tag{font-size:.65rem;background:rgba(239,83,80,.7);color:#fff;padding:1px 5px;border-radius:2px;white-space:nowrap}
  .card-actions{display:flex;flex-direction:column;align-items:center;gap:5px;margin-left:6px}
  .card-like-btn{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;cursor:pointer;color:#fff;font-size:.7rem}
  .card-like-btn .material-icons{font-size:17px;transition:color var(--transition)}
  .card-like-btn:hover .material-icons,.card-like-btn.liked .material-icons{color:#ef9a9a}
  .card-bm-btn{background:none;border:none;cursor:pointer;color:#fff;display:flex;align-items:center}
  .card-bm-btn .material-icons{font-size:18px}
  .card-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:2px;display:flex;align-items:center;gap:2px}
  .card-badge .material-icons{font-size:11px}
  .card-new{position:absolute;top:6px;left:6px;background:var(--primary);color:#fff;font-size:.6rem;padding:2px 6px;border-radius:2px;font-weight:700;letter-spacing:.5px}
  .empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--text-secondary);gap:14px;text-align:center}
  .empty-state .material-icons{font-size:72px;opacity:.2}
  .empty-state p{font-size:.95rem}
  .empty-state button{background:var(--primary);border:none;border-radius:4px;color:#fff;cursor:pointer;padding:10px 28px;font-size:.9rem;font-weight:500;transition:background var(--transition)}
  .empty-state button:hover{background:var(--primary-dark)}

  /* PAGINATION */
  .pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px 0}
  .page-btn{width:36px;height:36px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
  .page-btn:hover,.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .page-btn:disabled{opacity:.3;cursor:default;background:none;pointer-events:none}
  .page-btn .material-icons{font-size:18px}

  /* ACTIVE TAGS BAR */
  .active-tags-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .active-tag{background:rgba(239,83,80,.15);border:1px solid rgba(239,83,80,.4);border-radius:3px;padding:3px 10px;font-size:.8rem;color:var(--primary);display:flex;align-items:center;gap:6px;cursor:pointer}
  .active-tag .material-icons{font-size:14px}

  /* MODALS */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:10px;width:90%;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.7);animation:fadeUp .2s ease;max-height:92vh;overflow-y:auto}
  .modal.wide{max-width:560px}
  .modal.narrow{max-width:420px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .modal h2{font-size:1.1rem;margin-bottom:4px}
  .modal-sub{font-size:.85rem;color:var(--text-secondary);margin-bottom:18px}
  .modal label{font-size:.8rem;color:var(--text-secondary);display:block;margin-bottom:4px;margin-top:14px}
  .modal label:first-of-type{margin-top:0}
  .modal input,.modal select,.modal textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:8px 12px;color:var(--text);font-size:.9rem;outline:none;font-family:inherit}
  .modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--primary)}
  .modal textarea{resize:vertical;min-height:64px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .btn-ghost{background:none;border:1px solid var(--border);border-radius:4px;padding:8px 20px;color:var(--text);cursor:pointer;font-size:.85rem;transition:background var(--transition)}
  .btn-ghost:hover{background:var(--surface2)}
  .btn-primary{background:var(--primary);border:none;border-radius:4px;padding:8px 20px;color:#fff;cursor:pointer;font-size:.85rem;font-weight:500;transition:background var(--transition);display:flex;align-items:center;gap:6px}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-primary .material-icons{font-size:16px}

  /* DROPZONE */
  .dropzone{border:2px dashed var(--border);border-radius:8px;padding:32px 20px;text-align:center;cursor:pointer;transition:border var(--transition),background var(--transition);position:relative;margin-bottom:4px}
  .dropzone:hover,.dropzone.drag{border-color:var(--primary);background:rgba(239,83,80,.05)}
  .dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .dropzone .dz-icon{font-size:44px;color:var(--text-secondary);margin-bottom:8px}
  .dropzone p{font-size:.85rem;color:var(--text-secondary)}
  .dropzone p span{color:var(--primary);font-weight:500}
  .preview-wrap{position:relative;border-radius:6px;overflow:hidden;background:#000;margin-bottom:4px}
  .preview-wrap img,.preview-wrap video{width:100%;max-height:200px;object-fit:contain;display:block}
  .preview-clear{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);border:none;border-radius:50%;color:#fff;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
  .preview-clear .material-icons{font-size:15px}
  .tag-input-modal{display:flex;gap:6px;margin-bottom:8px}
  .tag-input-modal input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:7px 10px;color:var(--text);font-size:.85rem;outline:none}
  .tag-input-modal input:focus{border-color:var(--primary)}
  .tag-input-modal button{background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text);cursor:pointer;padding:7px 12px;font-size:.8rem;transition:background var(--transition)}
  .tag-input-modal button:hover{background:var(--primary);border-color:var(--primary);color:#fff}
  .post-tags-list{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
  .post-tag-chip{background:rgba(239,83,80,.15);border:1px solid rgba(239,83,80,.3);border-radius:3px;padding:3px 8px;font-size:.75rem;color:var(--primary);display:flex;align-items:center;gap:4px}
  .post-tag-chip button{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:0;line-height:1;font-size:15px;display:flex;align-items:center}
  .post-tag-chip button:hover{color:var(--primary)}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:800;display:none;align-items:center;justify-content:center;flex-direction:column}
  .lightbox.open{display:flex}
  .lightbox-close{position:absolute;top:14px;right:16px;background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:26px;line-height:1;transition:color .2s}
  .lightbox-close:hover{color:#fff}
  .lightbox-media{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:4px}
  .lightbox-info{margin-top:14px;text-align:center;padding:0 16px}
  .lightbox-title{font-size:1rem;color:#fff;margin-bottom:8px;font-weight:500}
  .lightbox-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
  .lightbox-tag{background:rgba(239,83,80,.4);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:2px;cursor:pointer}
  .lightbox-tag:hover{background:rgba(239,83,80,.7)}
  .lightbox-actions{display:flex;gap:8px;justify-content:center}
  .lb-action-btn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);border-radius:4px;padding:6px 14px;cursor:pointer;font-size:.8rem;transition:all .2s;display:flex;align-items:center;gap:5px}
  .lb-action-btn .material-icons{font-size:15px}
  .lb-action-btn:hover{background:rgba(255,255,255,.1);color:#fff}
  .lb-action-btn.danger:hover{background:var(--primary);border-color:var(--primary);color:#fff}
  .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;transition:background .2s}
  .lightbox-nav:hover{background:rgba(255,255,255,.18)}
  .lightbox-nav.prev{left:14px}
  .lightbox-nav.next{right:14px}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 22px;border-radius:4px;font-size:.9rem;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
  .toast.show{opacity:1}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  @media(max-width:768px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    .search-wrap{max-width:unset}
    .tag-creator{display:none}
    .upload-btn .upload-label{display:none}
  }
</style>
</head>
<body>

<!-- APPBAR -->
<header class="appbar">
  <button class="menu-btn" onclick="toggleSidebar()"><span class="material-icons">menu</span></button>
  <a class="logo" href="#">Kitty34</a>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search tags or titles..." onkeydown="handleSearch(event)">
    <span class="material-icons search-icon">search</span>
  </div>
  <div class="spacer"></div>
  <div class="right-actions">
    <button class="upload-btn" onclick="openUploadModal()">
      <span class="material-icons">add</span>
      <span class="upload-label">Upload</span>
    </button>
    <button class="icon-btn" onclick="toggleTheme()"><span class="material-icons" id="themeIcon">nightlight_round</span></button>
    <button class="icon-btn" onclick="openTagModal()" title="Create tag"><span class="material-icons">local_offer</span></button>
    <button class="icon-btn"><span class="material-icons">account_circle</span></button>
  </div>
</header>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <a class="nav-item active" onclick="filterView('all',this)"><span class="material-icons">home</span>Home</a>
  <a class="nav-item" onclick="filterView('hot',this)"><span class="material-icons">whatshot</span>Hot</a>
  <a class="nav-item" onclick="filterView('best',this)"><span class="material-icons">star_border</span>Best</a>
  <a class="nav-item" onclick="filterView('bookmarks',this)"><span class="material-icons">bookmark</span>Bookmarks</a>
  <a class="nav-item" onclick="filterView('mine',this)"><span class="material-icons">person</span>My Posts</a>
  <div class="nav-divider"></div>
  <div class="tag-creator">
    <h4>My Tags</h4>
    <div class="tag-input-wrap">
      <input type="text" id="sidebarTagInput" placeholder="New tag..." onkeydown="if(event.key==='Enter')addTagSidebar()">
      <button onclick="addTagSidebar()">Add</button>
    </div>
    <div class="tag-list" id="sidebarTagList"></div>
  </div>
</nav>

<!-- MAIN -->
<main class="main" id="main">
  <div class="active-tags-bar" id="activeTagsBar"></div>
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="filter-chip active" onclick="setSort(this,'latest')">Latest</button>
      <button class="filter-chip" onclick="setSort(this,'top')">Top Rated</button>
      <button class="filter-chip" onclick="setSort(this,'views')">Most Viewed</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="post-count" id="postCount"></span>
      <div class="view-toggle">
        <button class="view-btn active" onclick="setView('grid',this)"><span class="material-icons">apps</span></button>
        <button class="view-btn" onclick="setView('list',this)"><span class="material-icons">view_list</span></button>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>
</main>

<!-- UPLOAD MODAL -->
<div class="modal-overlay" id="uploadModal" onclick="bgClose(event,'uploadModal')">
  <div class="modal wide">
    <h2>Upload Post</h2>
    <p class="modal-sub">Share your content with the Kitty34 community</p>

    <div id="dropzone" class="dropzone" ondragover="dzOver(event,true)" ondragleave="dzOver(event,false)" ondrop="dzDrop(event)">
      <input type="file" id="fileInput" accept="image/*,video/*" onchange="fileSelected(event)">
      <span class="material-icons dz-icon">cloud_upload</span>
      <p>Drag & drop or <span>browse files</span></p>
      <p style="font-size:.73rem;margin-top:4px;opacity:.7">Supports images and videos</p>
    </div>
    <div id="previewWrap" class="preview-wrap" style="display:none">
      <img id="previewImg" style="display:none">
      <video id="previewVid" controls style="display:none"></video>
      <button class="preview-clear" onclick="clearFile()"><span class="material-icons">close</span></button>
    </div>

    <label>Title</label>
    <input type="text" id="postTitle" placeholder="Give your post a title..." maxlength="80">

    <label>Description <span style="opacity:.5;font-size:.75rem">(optional)</span></label>
    <textarea id="postDesc" placeholder="Add a description..."></textarea>

    <label>Rating</label>
    <select id="postRating">
      <option value="safe">Safe</option>
      <option value="questionable">Questionable</option>
      <option value="explicit">Explicit</option>
    </select>

    <label>Tags</label>
    <div class="tag-input-modal">
      <input type="text" id="postTagInput" placeholder="Type a tag and press Enter or Add..." onkeydown="if(event.key==='Enter')addPostTag()">
      <button onclick="addPostTag()">Add</button>
    </div>
    <div class="post-tags-list" id="postTagsList"></div>

    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('uploadModal')">Cancel</button>
      <button class="btn-primary" onclick="publishPost()"><span class="material-icons">publish</span>Publish</button>
    </div>
  </div>
</div>

<!-- TAG MODAL -->
<div class="modal-overlay" id="tagModal" onclick="bgClose(event,'tagModal')">
  <div class="modal narrow">
    <h2>Create a Tag</h2>
    <p class="modal-sub">Add a new tag to organize and filter content.</p>
    <label>Tag Name</label>
    <input type="text" id="modalTagName" placeholder="e.g. cute, fantasy, action..." onkeydown="if(event.key==='Enter')createTag()">
    <label>Category</label>
    <select id="modalTagCat">
      <option value="general">General</option>
      <option value="character">Character</option>
      <option value="artist">Artist</option>
      <option value="copyright">Copyright</option>
      <option value="meta">Meta</option>
    </select>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('tagModal')">Cancel</button>
      <button class="btn-primary" onclick="createTag()"><span class="material-icons">add</span>Create</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="lbBgClose(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav prev" onclick="lbNav(-1)"><span class="material-icons">chevron_left</span></button>
  <button class="lightbox-nav next" onclick="lbNav(1)"><span class="material-icons">chevron_right</span></button>
  <img class="lightbox-media" id="lbImg" style="display:none" alt="">
  <video class="lightbox-media" id="lbVid" controls style="display:none"></video>
  <div class="lightbox-info">
    <div class="lightbox-title" id="lbTitle"></div>
    <div class="lightbox-tags" id="lbTags"></div>
    <div class="lightbox-actions">
      <button class="lb-action-btn" onclick="lbLike()"><span class="material-icons">favorite_border</span><span id="lbLikeCount">0</span></button>
      <button class="lb-action-btn" onclick="lbBookmark()"><span class="material-icons">bookmark_border</span>Bookmark</button>
      <button class="lb-action-btn danger" id="lbDeleteBtn" onclick="deletePost()" style="display:none"><span class="material-icons">delete</span>Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let sidebarOpen = window.innerWidth > 768;
let darkTheme = true;
let currentView = 'grid';
let activeTags = [];
let sortMode = 'latest';
let viewMode = 'all';
let currentPage = 1;
let lbIdx = 0;
const PER_PAGE = 32;

let userTags  = JSON.parse(localStorage.getItem('k34_utags') || '[]');
let posts     = JSON.parse(localStorage.getItem('k34_posts') || '[]');
let bookmarks = JSON.parse(localStorage.getItem('k34_bm')    || '[]');
let likes     = JSON.parse(localStorage.getItem('k34_lk')    || '[]');

let pendingDataURL = null;
let pendingIsVideo = false;
let postTags = [];

// ── PERSIST ──
const save = () => {
  localStorage.setItem('k34_posts', JSON.stringify(posts));
  localStorage.setItem('k34_bm',    JSON.stringify(bookmarks));
  localStorage.setItem('k34_lk',    JSON.stringify(likes));
};
const saveUT = () => localStorage.setItem('k34_utags', JSON.stringify(userTags));

// ── HELPERS ──
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'p'+Date.now()+Math.random().toString(36).slice(2,7); }

// ── FILTERED POSTS ──
function getFiltered(){
  let r = [...posts];
  if(viewMode==='bookmarks') r = r.filter(p=>bookmarks.includes(p.id));
  else if(viewMode==='mine') r = r.filter(p=>p.mine);
  else if(viewMode==='hot')  r = r.filter(p=>(p.likes||0)+(p.views||0)>3);

  if(activeTags.length){
    r = r.filter(p => activeTags.every(t =>
      (p.tags||[]).some(pt=>pt.includes(t)) || (p.title||'').toLowerCase().includes(t)
    ));
  }

  if(sortMode==='latest') r.sort((a,b)=>b.created-a.created);
  else if(sortMode==='top') r.sort((a,b)=>(b.likes||0)-(a.likes||0));
  else if(sortMode==='views') r.sort((a,b)=>(b.views||0)-(a.views||0));
  return r;
}

// ── RENDER GRID ──
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.className = 'grid'+(currentView==='list'?' list-view':'');
  const all = getFiltered();
  const totalPages = Math.max(1,Math.ceil(all.length/PER_PAGE));
  if(currentPage>totalPages) currentPage=totalPages;
  const page = all.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);
  document.getElementById('postCount').textContent = all.length ? all.length+' post'+(all.length!==1?'s':'') : '';

  if(!page.length){
    const label = viewMode==='bookmarks'?'bookmarked posts':viewMode==='mine'?'posts yet':'posts matching your search';
    grid.innerHTML=`<div class="empty-state">
      <span class="material-icons">photo_library</span>
      <p>No ${label}</p>
      <button onclick="openUploadModal()">Upload something</button>
    </div>`;
    document.getElementById('pagination').innerHTML='';
    return;
  }

  grid.innerHTML = page.map(p=>{
    const isNew = Date.now()-p.created < 90000;
    const liked = likes.includes(p.id);
    const bmd   = bookmarks.includes(p.id);
    return `<div class="card" onclick="openLightbox(${all.indexOf(p)})">
      ${p.type==='video'
        ? `<video src="${p.src}" muted preload="metadata"></video>`
        : `<img src="${p.src}" alt="${esc(p.title)}" loading="lazy">`}
      ${isNew?'<div class="card-new">NEW</div>':''}
      ${p.type==='video'?'<div class="card-badge"><span class="material-icons">play_arrow</span>video</div>':''}
      <div class="card-overlay">
        <div class="card-info">
          <div class="card-title">${esc(p.title||'Untitled')}</div>
          <div class="card-tags-row">${(p.tags||[]).slice(0,3).map(t=>`<span class="card-tag">${esc(t)}</span>`).join('')}</div>
        </div>
        <div class="card-actions">
          <button class="card-like-btn ${liked?'liked':''}" onclick="event.stopPropagation();quickLike('${p.id}',this)">
            <span class="material-icons">${liked?'favorite':'favorite_border'}</span>
            <span id="lc-${p.id}">${p.likes||0}</span>
          </button>
          <button class="card-bm-btn" onclick="event.stopPropagation();quickBm('${p.id}',this)">
            <span class="material-icons" style="color:${bmd?'#ffca28':'#fff'}">${bmd?'bookmark':'bookmark_border'}</span>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
  renderPagination(totalPages);
}

// ── PAGINATION ──
function renderPagination(tp){
  const el=document.getElementById('pagination');
  if(tp<=1){el.innerHTML='';return;}
  let h=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}><span class="material-icons">chevron_left</span></button>`;
  for(let i=1;i<=tp;i++){
    if(tp>7&&i>2&&i<tp-1&&Math.abs(i-currentPage)>1){if(i===3)h+='<span style="color:var(--text-secondary);padding:0 4px">…</span>';continue;}
    h+=`<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  h+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===tp?'disabled':''}><span class="material-icons">chevron_right</span></button>`;
  el.innerHTML=h;
}
function goPage(p){currentPage=p;renderGrid();window.scrollTo({top:0,behavior:'smooth'});}

// ── SIDEBAR ──
function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  const s=document.getElementById('sidebar'),m=document.getElementById('main');
  if(window.innerWidth>768){s.classList.toggle('hidden',!sidebarOpen);m.classList.toggle('full',!sidebarOpen);}
  else s.classList.toggle('open',sidebarOpen);
}
function filterView(mode,el){
  viewMode=mode;currentPage=1;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
  if(window.innerWidth<=768){sidebarOpen=false;document.getElementById('sidebar').classList.remove('open');}
}

// ── THEME ──
function toggleTheme(){
  darkTheme=!darkTheme;
  document.documentElement.dataset.theme=darkTheme?'dark':'light';
  document.getElementById('themeIcon').textContent=darkTheme?'nightlight_round':'wb_sunny';
}

// ── SORT / VIEW ──
function setSort(btn,mode){
  sortMode=mode;currentPage=1;
  document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderGrid();
}
function setView(v,btn){
  currentView=v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderGrid();
}

// ── SEARCH ──
function handleSearch(e){
  if(e.key!=='Enter') return;
  const val=e.target.value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!val) return;
  if(!activeTags.includes(val)) activeTags.push(val);
  e.target.value='';currentPage=1;renderActiveTagsBar();renderGrid();
}

// ── ACTIVE TAGS ──
function renderActiveTagsBar(){
  document.getElementById('activeTagsBar').innerHTML=activeTags.map(t=>
    `<div class="active-tag" onclick="removeActiveTag('${t}')">${esc(t)}<span class="material-icons">close</span></div>`
  ).join('');
}
function removeActiveTag(t){activeTags=activeTags.filter(x=>x!==t);currentPage=1;renderActiveTagsBar();renderGrid();}

// ── USER TAGS ──
function renderSidebarTags(){
  document.getElementById('sidebarTagList').innerHTML=userTags.map((t,i)=>
    `<div class="tag-chip" onclick="toggleActiveTag('${t}')">
      ${esc(t)}<span class="material-icons" style="font-size:12px" onclick="event.stopPropagation();removeUT(${i})">close</span>
    </div>`
  ).join('') || '<span style="font-size:.73rem;color:var(--text-secondary)">No tags yet</span>';
}
function toggleActiveTag(tag){
  activeTags=activeTags.includes(tag)?activeTags.filter(x=>x!==tag):[...activeTags,tag];
  currentPage=1;renderActiveTagsBar();renderGrid();renderSidebarTags();
}
function addTagSidebar(){
  const el=document.getElementById('sidebarTagInput');
  const v=el.value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!v) return;
  if(userTags.includes(v)){showToast('Tag already exists');return;}
  userTags.push(v);saveUT();renderSidebarTags();el.value='';showToast(`Tag "${v}" added`);
}
function removeUT(i){
  const t=userTags[i];userTags.splice(i,1);
  activeTags=activeTags.filter(x=>x!==t);
  saveUT();renderSidebarTags();renderActiveTagsBar();renderGrid();
}
function openTagModal(){document.getElementById('tagModal').classList.add('open');setTimeout(()=>document.getElementById('modalTagName').focus(),80);}
function createTag(){
  const n=document.getElementById('modalTagName').value.trim().toLowerCase().replace(/\s+/g,'_');
  const c=document.getElementById('modalTagCat').value;
  if(!n){showToast('Enter a tag name');return;}
  if(userTags.includes(n)){showToast('Tag already exists');closeModal('tagModal');return;}
  userTags.push(n);saveUT();renderSidebarTags();closeModal('tagModal');
  document.getElementById('modalTagName').value='';
  showToast(`Tag "${n}" [${c}] created`);
}

// ── UPLOAD ──
function openUploadModal(){
  pendingDataURL=null;pendingIsVideo=false;postTags=[];
  ['postTitle','postDesc','postTagInput'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('postRating').value='safe';
  renderPostTags();clearFile();
  document.getElementById('uploadModal').classList.add('open');
  setTimeout(()=>document.getElementById('postTitle').focus(),100);
}
function dzOver(e,on){e.preventDefault();document.getElementById('dropzone').classList.toggle('drag',on);}
function dzDrop(e){e.preventDefault();document.getElementById('dropzone').classList.remove('drag');const f=e.dataTransfer.files[0];if(f)loadFile(f);}
function fileSelected(e){const f=e.target.files[0];if(f)loadFile(f);}
function loadFile(f){
  if(!f.type.startsWith('image/')&&!f.type.startsWith('video/')){showToast('Only images and videos supported');return;}
  if(f.size>50*1024*1024){showToast('File too large (max 50MB)');return;}
  pendingIsVideo=f.type.startsWith('video/');
  const reader=new FileReader();
  reader.onload=ev=>{
    pendingDataURL=ev.target.result;
    document.getElementById('dropzone').style.display='none';
    document.getElementById('previewWrap').style.display='block';
    const img=document.getElementById('previewImg'),vid=document.getElementById('previewVid');
    if(pendingIsVideo){img.style.display='none';vid.style.display='block';vid.src=pendingDataURL;}
    else{vid.style.display='none';img.style.display='block';img.src=pendingDataURL;}
  };
  reader.readAsDataURL(f);
}
function clearFile(){
  pendingDataURL=null;pendingIsVideo=false;
  document.getElementById('dropzone').style.display='block';
  document.getElementById('previewWrap').style.display='none';
  document.getElementById('previewImg').src='';
  document.getElementById('previewVid').src='';
  document.getElementById('fileInput').value='';
}
function addPostTag(){
  const el=document.getElementById('postTagInput');
  const v=el.value.trim().toLowerCase().replace(/\s+/g,'_');
  if(!v||postTags.includes(v)){el.value='';return;}
  postTags.push(v);
  if(!userTags.includes(v)){userTags.push(v);saveUT();renderSidebarTags();}
  renderPostTags();el.value='';
}
function removePostTag(t){postTags=postTags.filter(x=>x!==t);renderPostTags();}
function renderPostTags(){
  document.getElementById('postTagsList').innerHTML=postTags.map(t=>
    `<div class="post-tag-chip">${esc(t)}<button onclick="removePostTag('${t}')">×</button></div>`
  ).join('');
}
function publishPost(){
  if(!pendingDataURL){showToast('Please select a file first');return;}
  const title=document.getElementById('postTitle').value.trim();
  const post={
    id:uid(),src:pendingDataURL,
    title:title||'Untitled',
    desc:document.getElementById('postDesc').value.trim(),
    rating:document.getElementById('postRating').value,
    tags:[...postTags],
    type:pendingIsVideo?'video':'image',
    likes:0,views:0,created:Date.now(),mine:true
  };
  posts.unshift(post);save();
  closeModal('uploadModal');
  viewMode='all';currentPage=1;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('.nav-item').classList.add('active');
  renderGrid();showToast('Post published! 🎉');
}

// ── QUICK LIKE / BM ──
function quickLike(id,btn){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(likes.includes(id)){
    likes=likes.filter(x=>x!==id);p.likes=Math.max(0,(p.likes||0)-1);
    btn.classList.remove('liked');btn.querySelector('.material-icons').textContent='favorite_border';
  }else{
    likes.push(id);p.likes=(p.likes||0)+1;
    btn.classList.add('liked');btn.querySelector('.material-icons').textContent='favorite';
  }
  const lc=document.getElementById('lc-'+id);if(lc)lc.textContent=p.likes;
  save();
}
function quickBm(id,btn){
  if(bookmarks.includes(id)){
    bookmarks=bookmarks.filter(x=>x!==id);btn.querySelector('.material-icons').style.color='#fff';btn.querySelector('.material-icons').textContent='bookmark_border';
    showToast('Removed from bookmarks');
  }else{
    bookmarks.push(id);btn.querySelector('.material-icons').style.color='#ffca28';btn.querySelector('.material-icons').textContent='bookmark';
    showToast('Bookmarked ⭐');
  }
  save();
}

// ── LIGHTBOX ──
function openLightbox(idx){
  const all=getFiltered();const p=all[idx];if(!p)return;
  lbIdx=idx;p.views=(p.views||0)+1;save();
  const lb=document.getElementById('lightbox');lb.classList.add('open');
  document.getElementById('lbTitle').textContent=p.title||'Untitled';
  document.getElementById('lbTags').innerHTML=(p.tags||[]).map(t=>
    `<span class="lightbox-tag" onclick="filterByTag('${t}')">${esc(t)}</span>`
  ).join('');
  const liked=likes.includes(p.id);
  const lbLikeBtn=lb.querySelector('.lb-action-btn');
  lbLikeBtn.querySelector('.material-icons').textContent=liked?'favorite':'favorite_border';
  document.getElementById('lbLikeCount').textContent=p.likes||0;
  document.getElementById('lbDeleteBtn').style.display=p.mine?'flex':'none';
  const img=document.getElementById('lbImg'),vid=document.getElementById('lbVid');
  if(p.type==='video'){img.style.display='none';vid.style.display='block';vid.src=p.src;}
  else{vid.style.display='none';vid.src='';img.style.display='block';img.src=p.src;}
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lbVid').src='';}
function lbBgClose(e){if(e.target===e.currentTarget)closeLightbox();}
function lbNav(d){const all=getFiltered();const n=lbIdx+d;if(n>=0&&n<all.length)openLightbox(n);}
function lbLike(){
  const all=getFiltered();const p=all[lbIdx];if(!p)return;
  const btn=document.getElementById('lightbox').querySelector('.lb-action-btn');
  quickLike(p.id,{classList:{contains:()=>likes.includes(p.id),remove:()=>{},add:()=>{}},querySelector:()=>btn.querySelector('.material-icons')});
  // simpler: just toggle directly
  const p2=posts.find(x=>x.id===p.id);
  const icon=btn.querySelector('.material-icons');
  if(likes.includes(p.id)){
    likes=likes.filter(x=>x!==p.id);if(p2)p2.likes=Math.max(0,(p2.likes||0)-1);icon.textContent='favorite_border';
  }else{
    likes.push(p.id);if(p2)p2.likes=(p2.likes||0)+1;icon.textContent='favorite';
  }
  document.getElementById('lbLikeCount').textContent=p2?p2.likes:0;
  save();renderGrid();
}
function lbBookmark(){
  const all=getFiltered();const p=all[lbIdx];if(!p)return;
  if(bookmarks.includes(p.id)){bookmarks=bookmarks.filter(x=>x!==p.id);showToast('Removed from bookmarks');}
  else{bookmarks.push(p.id);showToast('Bookmarked ⭐');}
  save();renderGrid();
}
function deletePost(){
  const all=getFiltered();const p=all[lbIdx];if(!p)return;
  if(!confirm('Delete this post?'))return;
  posts=posts.filter(x=>x.id!==p.id);save();closeLightbox();renderGrid();showToast('Post deleted');
}
function filterByTag(tag){
  closeLightbox();
  if(!activeTags.includes(tag))activeTags.push(tag);
  currentPage=1;renderActiveTagsBar();renderGrid();
}

// ── MODAL HELPERS ──
function closeModal(id){document.getElementById(id).classList.remove('open');}
function bgClose(e,id){if(e.target===e.currentTarget)closeModal(id);}

// ── TOAST ──
let tt;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400);
}

// ── KEYBOARD ──
document.addEventListener('keydown',e=>{
  if(document.getElementById('lightbox').classList.contains('open')){
    if(e.key==='Escape')closeLightbox();
    if(e.key==='ArrowLeft')lbNav(-1);
    if(e.key==='ArrowRight')lbNav(1);
  }else{
    if(e.key==='Escape'){closeModal('uploadModal');closeModal('tagModal');}
  }
});

// ── INIT ──
renderGrid();
renderSidebarTags();
</script>
</body>
</html>
